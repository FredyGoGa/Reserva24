services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reserva24
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build:
      context: .
    image: reserva24:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      db:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: reserva24-api:local
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reserva24?schema=public
      BACKEND_PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3000
      AUTH_SECRET: local-development-secret-at-least-32-characters
      SESSION_TTL_SECONDS: 604800
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data:
