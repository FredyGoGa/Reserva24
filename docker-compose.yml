services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reserva24
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reserva24"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
    image: reserva24:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: reserva24-api:local
    env_file:
      - .env.local
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      BACKEND_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reserva24?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
